<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1050" viewBox="0 0 1700 1050">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#334155" />
    </marker>
    <style>
      .bg { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; }
      .title { font-family: Arial, sans-serif; font-size: 20px; fill: #0f172a; font-weight: 700; }
      .label { font-family: Arial, sans-serif; font-size: 18px; fill: #0f172a; }
      .small { font-family: Arial, sans-serif; font-size: 15px; fill: #334155; }
      .node { rx: 18; ry: 18; stroke-width: 2.2; }
      .edge { stroke: #334155; stroke-width: 2.6; fill: none; marker-end: url(#arrow); }
      .dashed { stroke-dasharray: 9 7; }
      .client { fill: #1d4ed8; stroke: #1e40af; }
      .svc { fill: #2563eb; stroke: #1d4ed8; }
      .data { fill: #10b981; stroke: #059669; }
      .bus { fill: #f59e0b; stroke: #d97706; }
      .ext { fill: #ef4444; stroke: #dc2626; }
    </style>
  </defs>

  <rect x="20" y="20" width="1660" height="1010" rx="24" ry="24" class="bg"/>
  <text x="850" y="55" text-anchor="middle" class="title">UML-схема архитектуры приложения «Питомец.ком»</text>

  <!-- Top client layer -->
  <rect class="node client" x="610" y="90" width="380" height="70"/>
  <text x="800" y="134" text-anchor="middle" class="label" fill="#fff">User / Browser</text>

  <line class="edge" x1="800" y1="160" x2="800" y2="205"/>

  <rect class="node svc" x="560" y="205" width="480" height="74"/>
  <text x="800" y="252" text-anchor="middle" class="label" fill="#fff">Traefik (reverse proxy)</text>

  <!-- Main services -->
  <rect class="node svc" x="130" y="340" width="310" height="82"/>
  <text x="285" y="389" text-anchor="middle" class="label" fill="#fff">Frontend</text>

  <rect class="node svc" x="645" y="330" width="410" height="96"/>
  <text x="850" y="377" text-anchor="middle" class="label" fill="#fff">Monolit (Gateway)</text>
  <text x="850" y="402" text-anchor="middle" class="small" fill="#fff">API / business logic</text>

  <rect class="node svc" x="1260" y="340" width="320" height="82"/>
  <text x="1420" y="389" text-anchor="middle" class="label" fill="#fff">Messenger (WebSocket)</text>

  <!-- Traefik to services -->
  <path class="edge" d="M800 279 L800 310 L285 310 L285 340"/>
  <path class="edge" d="M800 279 L800 330"/>
  <path class="edge" d="M800 279 L800 310 L1420 310 L1420 340"/>

  <!-- Data and integration layer -->
  <rect class="node data" x="70" y="545" width="220" height="72"/>
  <text x="180" y="589" text-anchor="middle" class="label" fill="#fff">PostgreSQL</text>

  <rect class="node data" x="340" y="545" width="180" height="72"/>
  <text x="430" y="589" text-anchor="middle" class="label" fill="#fff">Redis</text>

  <rect class="node data" x="560" y="545" width="250" height="72"/>
  <text x="685" y="589" text-anchor="middle" class="label" fill="#fff">Elasticsearch</text>

  <rect class="node data" x="860" y="545" width="180" height="72"/>
  <text x="950" y="589" text-anchor="middle" class="label" fill="#fff">MinIO</text>

  <rect class="node bus" x="1080" y="545" width="180" height="72"/>
  <text x="1170" y="589" text-anchor="middle" class="label" fill="#0f172a">Kafka</text>

  <rect class="node svc" x="900" y="690" width="270" height="76"/>
  <text x="1035" y="736" text-anchor="middle" class="label" fill="#fff">Moderator service</text>

  <rect class="node svc" x="1210" y="690" width="310" height="76"/>
  <text x="1365" y="736" text-anchor="middle" class="label" fill="#fff">Notifications service</text>

  <rect class="node ext" x="900" y="850" width="290" height="76"/>
  <text x="1045" y="896" text-anchor="middle" class="label" fill="#fff">Moderium API (external)</text>

  <rect class="node ext" x="1230" y="850" width="250" height="76"/>
  <text x="1355" y="896" text-anchor="middle" class="label" fill="#fff">SMTP server (external)</text>

  <!-- Gateway to data -->
  <path class="edge" d="M760 426 L760 500 L180 500 L180 545"/>
  <path class="edge" d="M790 426 L790 500 L430 500 L430 545"/>
  <path class="edge" d="M850 426 L850 500 L685 500 L685 545"/>
  <path class="edge" d="M910 426 L910 500 L950 500 L950 545"/>
  <path class="edge" d="M970 426 L970 500 L1170 500 L1170 545"/>

  <!-- Outbox relation between PostgreSQL and Elasticsearch -->
  <path class="edge dashed" d="M290 581 L290 640 L685 640 L685 617"/>
  <text x="487" y="628" text-anchor="middle" class="small">Outbox</text>
  <text x="487" y="648" text-anchor="middle" class="small">sync to search</text>

  <!-- Kafka events to services -->
  <path class="edge" d="M1170 617 L1170 660 L1035 660 L1035 690"/>
  <path class="edge" d="M1260 581 L1310 581 L1310 690 L1365 690"/>
  <text x="1218" y="652" text-anchor="middle" class="small">events</text>

  <!-- Service external integrations -->
  <path class="edge" d="M1035 766 L1045 850"/>
  <path class="edge" d="M1365 766 L1355 850"/>
  <text x="1210" y="818" text-anchor="middle" class="small">email / account notifications</text>

  <!-- Minor annotation -->
  <text x="850" y="980" text-anchor="middle" class="small">Архитектура отражает веб-клиент, gateway, сервис сообщений, поисковый индекс и асинхронную интеграцию через Kafka и Outbox.</text>
</svg>
